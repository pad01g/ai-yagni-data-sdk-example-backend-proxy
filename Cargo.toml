[workspace]
resolver = "3"
members = ["api", "proxy", "verified"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/pad01g/ai-yagni-data-sdk-example-backend-proxy"

[workspace.dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306" }
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(verus_keep_ghost)'] }

# argon2 は最適化しないと遅い（テストで何度もハッシュを計算する）
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
