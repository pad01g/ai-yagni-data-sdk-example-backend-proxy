// backend-proxy が受け付ける操作の全部。
//
// backend-rust はデータベースにも決済サービスにも直接つながらず、この操作だけを呼ぶ。どの操作も、proxy の中の
// 固定クエリ（queries/*.sql）だけを使う。SQL の文字列や、表・列の名前を受け取る操作はない。
//
// 顧客を名指しする操作は、顧客 ID ではなく proxy が発行したセッションのトークンを受け取る。トークンの署名の鍵は
// proxy だけが持つ。そのため backend-rust が乗っ取られても、ログインした顧客のデータにしか触れない
// （ほかの顧客の個人情報や注文を読む、ほかの顧客として注文する、パスワードのハッシュを読む、はできない）。
//
// 失敗は gRPC の状態で返す。メッセージは決まった短い英語で、利用者向けの言葉にするのは backend-rust の仕事:
//   INVALID_ARGUMENT    "invalid <field>"
//   UNAUTHENTICATED     "unauthenticated"（トークンが無効・期限切れ・ログアウト済み）、"wrong credentials"
//   ALREADY_EXISTS      "email taken"、"request_key reused"（同じキーで違う中身の注文）
//   FAILED_PRECONDITION "out of stock: <商品名>"、"payment declined: <理由>"、"payment conflict"
//   NOT_FOUND           "no such order"
//   UNAVAILABLE         "busy"、"payment unavailable"（同じ依頼をやり直してよい）
//   INTERNAL            "internal"（詳しいことは proxy のログにだけ書く）
syntax = "proto3";

package shop.v1;

service Shop {
  // 登録してセッションを始める。メールは小文字にそろえる。
  rpc SignUp(SignUpRequest) returns (Session);
  // メールとパスワードを照合してセッションを始める。登録がないときも "wrong credentials"（区別しない）。
  rpc LogIn(LogInRequest) returns (Session);
  // その顧客のセッションを、ほかの端末のものも含めてすべて終える。トークンが無効でも成功する。
  rpc LogOut(LogOutRequest) returns (LogOutResponse);
  rpc Me(MeRequest) returns (Customer);

  rpc ListProducts(ListProductsRequest) returns (ProductList);

  // 注文する。在庫を引き当てて注文を pending で書き（1 つ目のトランザクション）、決済サービスに請求し、
  // 結果で paid か declined に決着させる。同じ (顧客, request_key) には同じ注文を返す。
  // 決済サービスに届かなければ UNAVAILABLE で、注文は pending のまま残る。同じ依頼をやり直すと決着する。
  rpc PlaceOrder(PlaceOrderRequest) returns (Order);
  // 新しい注文から 100 件（決済が拒否された注文は含めない）。
  rpc ListOrders(ListOrdersRequest) returns (OrderList);
  rpc GetOrder(GetOrderRequest) returns (Order);
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
  string address = 4;
}

message LogInRequest {
  string email = 1;
  string password = 2;
}

message Session {
  // backend-rust は中身を解釈せず、cookie に入れて次の依頼で返す。
  string token = 1;
  // 有効な秒数
  uint64 max_age = 2;
  Customer customer = 3;
}

message LogOutRequest {
  string token = 1;
}

message LogOutResponse {}

message MeRequest {
  string token = 1;
}

message Customer {
  string email = 1;
  string full_name = 2;
  string address = 3;
}

message ListProductsRequest {}

message Product {
  uint64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  // 円（最小単位）
  uint32 price = 5;
  int32 stock = 6;
}

message ProductList {
  repeated Product products = 1;
}

message OrderLine {
  uint64 product_id = 1;
  uint32 quantity = 2;
}

message PlaceOrderRequest {
  string token = 1;
  // 依頼の冪等キー（小文字の UUID）
  string request_key = 2;
  repeated OrderLine lines = 3;
  // 決済サービスのカードのトークン
  string card_token = 4;
}

message OrderItem {
  uint32 line_no = 1;
  uint64 product_id = 2;
  string product_name = 3;
  uint32 quantity = 4;
  uint32 unit_price = 5;
}

message Order {
  uint64 id = 1;
  uint64 total = 2;
  // pending, paid, shipped, cancelled
  string status = 3;
  // UTC（YYYY-MM-DD HH:MM:SS.ffffff）
  string created_at = 4;
  repeated OrderItem items = 5;
}

message ListOrdersRequest {
  string token = 1;
}

message OrderList {
  repeated Order orders = 1;
}

message GetOrderRequest {
  string token = 1;
  uint64 order_id = 2;
}
